<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYONGESA BNB - Nairobi</title>
<img src-"logo.png" alt-"logo" width-"150">
<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:green;
    color:#222;
}

/* NAVBAR */
nav{
    background:#fff;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    position:sticky;
    top:0;
    z-index:1000;
}

nav h1{
    margin:0;
    font-size:20px;
}

nav a{
    text-decoration:none;
    margin-left:20px;
    color:#333;
    font-weight:500;
}

/* HERO */
.hero{
    text-align:center;
    padding:50px 20px;
    color:#fff;
}

.hero h2{
    font-size:32px;
    margin-bottom:10px;
}

/* LISTING SECTION */
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.listing{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    margin-bottom:40px;
}

/* IMAGE SLIDER */
.slider{
    position:relative;
    height:350px;
    overflow:hidden;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    opacity:0;
    transition:0.6s;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.slide.active{
    opacity:1;
}

.price-tag{
    position:absolute;
    top:15px;
    left:15px;
    background:#fff;
    padding:6px 12px;
    border-radius:20px;
    font-weight:600;
}

.heart{
    position:absolute;
    top:15px;
    right:15px;
    background:#fff;
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
}

.heart.active{
    color:#FF385C;
    transform:scale(1.2);
}

/* CONTENT */
.content{
    padding:20px;
}

.booking-box{
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
}

.booking-box input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

.guest-control{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.counter-btn{
    background:#FF385C;
    color:#fff;
    border:none;
    width:30px;
    height:30px;
    border-radius:50%;
    cursor:pointer;
}

.total{
    margin-top:10px;
    font-weight:600;
}

.reserve-btn{
    background:#FF385C;
    color:#fff;
    border:none;
    padding:14px;
    width:100%;
    border-radius:12px;
    margin-top:15px;
    font-weight:600;
    cursor:pointer;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    background:#fff;
    margin-top:40px;
}

/* RESPONSIVE */
@media(max-width:768px){
    .hero h2{ font-size:24px; }
    .slider{ height:250px; }
}
</style>
</head>

<body>

<nav>
    <h1>NYONGESA BNBs</h1>
    <div>
        <a href="#">Home</a>
        <a href="#">Booking</a>
        <a href="#">Contact</a>
    </div>
</nav>

<section class="hero">
    <h2>Modern Airbnb Stay in Nairobi</h2>
    <p>Comfort • Style • Central Location</p>
</section>

<div class="container">

<div class="listing">

<div class="slider">
    <div class="slide active"><img src="room 1.jpg"></div>
    <div class="slide"><img src="room 2.jpg"></div>
    <div class="slide"><img src="room 3.jpg"></div>
    <div class="slide"><img src="room 4.jpg"></div>

    <div class="price-tag">KSh 4,000 / night</div>
    <div class="heart" onclick="toggleHeart(this)">♡</div>
</div>

<div class="content">
    <h2>NYONGESA BNB - Westlands</h2>
    <p>⭐ . 5·00 10,109 reviews · Nairobi</p>

    <div class="booking-box">
        <input type="date" id="checkin" onchange="calculateTotal()">
        <input type="date" id="checkout" onchange="calculateTotal()">

        <div class="guest-control">
            <span>Guests</span>
            <div>
                <button class="counter-btn" onclick="changeGuests(-1)">−</button>
                <span id="guestCount">1</span>
                <button class="counter-btn" onclick="changeGuests(1)">+</button>
            </div>
        </div>

        <div class="total" id="totalPrice">
            Total: KSh 0
        </div>
    </div>

    <button class="reserve-btn" onclick="reserve()">Reserve</button>
</div>

</div>

</div>

<footer>
    © 2026 NYONGESA BNBs | WhatsApp: +254 702 894 203
</footer>

<script>
let slides=document.querySelectorAll(".slide");
let current=0;
setInterval(()=>{
    slides[current].classList.remove("active");
    current=(current+1)%slides.length;
    slides[current].classList.add("active");
},4000);

let pricePerNight=4000;
let guests=1;

function toggleHeart(el){
    el.classList.toggle("active");
    el.textContent=el.classList.contains("active")?"♥":"♡";
}

function changeGuests(change){
    guests+=change;
    if(guests<1) guests=1;
    if(guests>10) guests=10;
    document.getElementById("guestCount").textContent=guests;
}

function calculateTotal(){
    let checkin=new Date(document.getElementById("checkin").value);
    let checkout=new Date(document.getElementById("checkout").value);
    if(checkin && checkout && checkout>checkin){
        let nights=(checkout-checkin)/(1000*60*60*24);
        let total=nights*pricePerNight;
        document.getElementById("totalPrice").textContent=
        "Total: KSh "+total.toLocaleString()+" ("+nights+" nights)";
    }
}

function reserve(){
    let checkin=document.getElementById("checkin").value;
    let checkout=document.getElementById("checkout").value;

    if(!checkin||!checkout){
        alert("Please select dates");
        return;
    }

    let message="Hello, I want to book NYONGESA BNB.\n"+
    "Check-in: "+checkin+"\n"+
    "Check-out: "+checkout+"\n"+
    "Guests: "+guests;

    let url="https://wa.me/254702894203?text="+encodeURIComponent(message);
    window.open(url,"_blank");
}
</script>

</body>

</html>
